# Streamlit 설정 (streamlit run 을 프로젝트 루트에서 실행할 때 적용)

[server]
# 이 PC에서만 접속 허용 — 외부에서 접속해 OpenAI 키가 소모되는 것을 방지
# Docker 컨테이너에서는 --server.address 0.0.0.0 으로 덮어써야 함
address = "localhost"
port = 8501
headless = true

[browser]
gatherUsageStats = false

[theme]
# 앱 CSS 가 본문 배경을 밝은 색(#f8f9fb)으로 고정하므로 테마도 라이트로 고정.
# 지정하지 않으면 PC·브라우저가 다크 모드일 때 글자만 흰색이 되어 보이지 않음 (PROJECT_DOCS #035)
base = "light"
